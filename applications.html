<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض التقديمات | ANON-RP</title>

<style>
body{
  background:#0b0b0f;
  color:white;
  font-family:Arial;
  padding:20px;
}

.box{
  max-width:700px;
  margin:auto;
}

.card{
  background:#15151c;
  border-radius:15px;
  padding:20px;
  margin:15px 0;
}

h1{
  text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h1>📋 تقديمات ANON-RP</h1>

<div id="result">جاري التحميل...</div>

</div>


<script>

const URL = "https://zqpemyoukxseyhgnrzja.supabase.co";

const KEY = "sb_publishable_clUVX-Bp8tXeyrrhyaXQQQ_XIMlkBHz";


async function load(){

let res = await fetch(
URL + "/rest/v1/applications?select=*",
{
headers:{
"apikey":KEY,
"Authorization":"Bearer "+KEY
}
}
);

let data = await res.json();
console.log(data);

let result=document.getElementById("result");

result.innerHTML="";


if(data.length===0){
result.innerHTML="<div class='card'>لا توجد تقديمات</div>";
return;
}


data.forEach(app=>{

result.innerHTML += `

<div class="card">

<h3>📄 تقديم</h3>

<p>👤 الاسم: ${app.name}</p>
<p>🎂 العمر: ${app.age}</p>
<p>💬 Discord: ${app.discord}</p>
<p>📌 النوع: ${app.type}</p>
<p>📝 السبب: ${app.reason}</p>
<p>⭐ الخبرة: ${app.experience}</p>
<p>❓ لماذا نختارك: ${app.why}</p>

</div>

`;

});

}

load();

</script>

</body>
</html>
