<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض التقديمات | ANON-RP</title>

<style>
body{
    background:#0b0b0f;
    color:white;
    font-family:Arial;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#15151c;
    padding:20px;
    margin:15px 0;
    border-radius:15px;
}

h1{
    text-align:center;
}

.error{
    color:#ff5555;
}
</style>

</head>

<body>

<div class="container">

<h1>📋 تقديمات ANON-RP</h1>

<div id="result">
جاري تحميل التقديمات...
</div>

</div>


<script>

const SUPABASE_URL = "https://zqpemyoukxseyhgnrzja.supabase.co";

const SUPABASE_KEY = "sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";


async function loadApplications(){

const result = document.getElementById("result");


try{


const res = await fetch(
`${SUPABASE_URL}/rest/v1/applications?select=*`,
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
}
}
);



const text = await res.text();


console.log(text);



if(!res.ok){

throw new Error(text);

}



const data = JSON.parse(text);



if(data.length === 0){

result.innerHTML =
"<div class='card'>لا توجد تقديمات</div>";

return;

}



result.innerHTML="";



data.forEach(app=>{


result.innerHTML += `

<div class="card">

<h2>📄 تقديم</h2>

<p>👤 الاسم: ${app.name || ""}</p>

<p>🎂 العمر: ${app.age || ""}</p>

<p>💬 Discord: ${app.discord || ""}</p>

<p>📌 النوع: ${app.type || ""}</p>

<p>📝 السبب: ${app.reason || ""}</p>

<p>⭐ الخبرة: ${app.experience || ""}</p>

<p>❓ لماذا نختارك: ${app.why || ""}</p>

</div>

`;


});


}

catch(err){

console.log(err);

result.innerHTML =
`
<div class="card error">
❌ خطأ:
<br>
${err.message}
</div>
`;

}


}


loadApplications();


</script>

</body>
</html>
