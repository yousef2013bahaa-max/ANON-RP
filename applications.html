<script>
const SUPABASE_URL = "https://zqpemyoukxseyhgnrzja.supabase.co";
const SUPABASE_KEY = "sb_publishable_mUGB0FZrWlVpxHspDlq8SQ_cIu3Pmcr";

async function loadApplications(){

  const box = document.getElementById("result");

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/applications?select=*",
      {
        headers:{
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data = await response.json();

    console.log(data);

    if(!data.length){
      box.innerHTML = "لا توجد تقديمات";
      return;
    }

    box.innerHTML = "";

    data.forEach(app=>{
      box.innerHTML += `
      <div class="card">
        <h3>📄 تقديم</h3>
        <p>الاسم: ${app.name}</p>
        <p>العمر: ${app.age}</p>
        <p>Discord: ${app.discord}</p>
        <p>النوع: ${app.type}</p>
        <p>السبب: ${app.reason}</p>
        <p>الخبرة: ${app.experience}</p>
        <p>لماذا نختارك: ${app.why}</p>
      </div>
      `;
    });

  } catch(error){
    box.innerHTML = "حصل خطأ";
    console.log(error);
  }
}

loadApplications();
</script>
