<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض التقديمات | ANON-RP</title>

<style>
body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
}

.card{
  background:#15151c;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
  margin:15px 0;
}

#status{
  text-align:center;
  color:#aaa;
}

a{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#aaa;
  text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>📋 تقديمات ANON-RP</h1>

<div id="status">
جاري تحميل التقديمات...
</div>

<div id="list"></div>

<a href="profile.html">
← العودة إلى حسابي
</a>

</div>


<script>

const SUPABASE_URL = "https://zqpemyoukxseyhgnrzja.supabase.co";

const SUPABASE_KEY = "sb_publishable_clUVX-Bp8tXeyrrhyaXQQQ_XIMlkBHz";


async function getApplications(){

try{

let response = await fetch(
SUPABASE_URL + "/rest/v1/applications?select=*",
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);


let data = await response.json();


document.getElementById("status").style.display="none";


if(data.length === 0){

document.getElementById("list").innerHTML =
`
<div class="card">
لا توجد تقديمات حاليا
</div>
`;

return;

}


data.forEach((app)=>{

document.getElementById("list").innerHTML +=

`
<div class="card">

<h2>📄 طلب تقديم</h2>

<p>👤 الاسم: ${app.name}</p>

<p>🎂 العمر: ${app.age}</p>

<p>💬 Discord: ${app.discord}</p>

<p>📌 النوع: ${app.type}</p>

<p>📝 السبب: ${app.reason}</p>

<p>⭐ الخبرات: ${app.experience}</p>

<p>❓ لماذا نختارك: ${app.why}</p>

</div>
`;

});


}

catch(error){

document.getElementById("status").innerHTML =
"❌ خطأ في تحميل التقديمات";

console.log(error);

}

}


getApplications();

</script>

</body>
</html>
