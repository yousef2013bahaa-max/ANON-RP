<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التقديم | ANON-RP</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
background:#15151c;
padding:25px;
border-radius:18px;
}

h1{
text-align:center;
}

input,select,textarea,button{

width:100%;
padding:13px;
margin:8px 0 15px;
border-radius:10px;
border:1px solid #333;
background:#0e0e13;
color:white;

}

button{

background:white;
color:black;
font-weight:bold;
font-size:16px;

}

.success{

display:none;
text-align:center;
color:#7dff91;
margin-top:20px;

}

</style>

</head>


<body>


<div class="container">


<h1>📋 التقديم في ANON-RP</h1>


<form id="applyForm">


<input id="name" placeholder="الاسم داخل السيرفر" required>


<input id="age" type="number" placeholder="العمر" required>


<input id="discord" placeholder="Discord ID" required>


<select id="type" required>

<option value="">نوع التقديم</option>

<option>إدارة</option>

<option>مراقب</option>

<option>ستاف</option>

<option>عصابة</option>

<option>أخرى</option>

</select>


<textarea id="reason" placeholder="سبب التقديم" required></textarea>


<textarea id="experience" placeholder="الخبرات" required></textarea>


<textarea id="why" placeholder="لماذا نختارك؟" required></textarea>


<button type="submit">
🚀 إرسال التقديم
</button>


</form>


<div class="success" id="success">

✅ تم إرسال التقديم بنجاح!
<br>
سيتم مراجعته من الإدارة.

</div>


</div>



<script>


const SUPABASE_URL =
"https://zqpemyoukxseyhgnrzja.supabase.co";


const SUPABASE_KEY =
"sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";



document.getElementById("applyForm")
.addEventListener("submit", async function(e){


e.preventDefault();



let data={


name:document.getElementById("name").value,

age:Number(document.getElementById("age").value),

discord:document.getElementById("discord").value,

type:document.getElementById("type").value,

reason:document.getElementById("reason").value,

experience:document.getElementById("experience").value,

why:document.getElementById("why").value


};



try{


let res = await fetch(

SUPABASE_URL+"/rest/v1/applications",

{

method:"POST",

headers:{

"Content-Type":"application/json",

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

},

body:JSON.stringify(data)

}

);



if(!res.ok){

throw new Error();

}



document.getElementById("applyForm").style.display="none";

document.getElementById("success").style.display="block";


}

catch(e){

alert("❌ فشل إرسال التقديم");

console.log(e);

}



});


</script>


</body>

</html>
