<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANON RP - تسجيل الدخول</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #15151d;
      padding: 30px;
      border-radius: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 25px #000;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      background: #24242e;
      color: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #6c2cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5420cc;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎭 ANON RP</h1>

    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button onclick="login()">تسجيل الدخول</button>

    <p id="message"></p>
  </div>

  <script>
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (username === "" || password === "") {
        message.textContent = "⚠️ اكتب اسم المستخدم وكلمة المرور";
        return;
      }

      message.textContent = "✅ تم تسجيل الدخول بنجاح!";
    }
  </script>

</body>
</html>
