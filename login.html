<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANON RP - تسجيل الدخول</title>
<style>
body{margin:0;background:#0b0b10;color:white;font-family:Arial;text-align:center}
.box{max-width:400px;margin:80px auto;padding:30px;background:#15151d;border:1px solid #e22;border-radius:20px}
h1{color:#ff2635}
input,button{width:90%;padding:14px;margin:8px;border-radius:10px;box-sizing:border-box}
input{background:#0d0d12;color:white;border:1px solid #555}
button{background:#e52335;color:white;border:0;font-size:17px}
</style>
</head>
<body>
<div class="box">
<h1>ANON RP</h1>
<h2>تسجيل الدخول</h2>

<input type="text" placeholder="اسم المستخدم">
<input type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<p id="msg"></p>
</div>

<script>
function login(){
document.getElementById("msg").textContent="تم الضغط على تسجيل الدخول";
}
</script>
</body>
</html>
