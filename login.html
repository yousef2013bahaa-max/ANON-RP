<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | ANON RP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Tahoma,sans-serif;
background:#07080c;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:#111217;
border:1px solid #3a151d;
border-radius:20px;
padding:30px;
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
margin-bottom:25px;
}

.logo span{color:#ef233c}

h1{
text-align:center;
font-size:30px;
margin-bottom:30px;
}

label{
display:block;
margin:15px 0 7px;
font-weight:bold;
}

input{
width:100%;
padding:14px;
border:1px solid #333;
border-radius:10px;
background:#08090d;
color:white;
font-size:16px;
outline:none;
}

button{
display:block;
width:100%;
margin-top:25px;
padding:15px;
background:#ef233c;
color:white;
border:0;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.message{
text-align:center;
margin-top:15px;
color:#aaa;
}

.register{
display:block;
text-align:center;
margin-top:20px;
color:#ef233c;
text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">
ANON <span>RP</span>
</div>

<h1>تسجيل الدخول</h1>

<form id="loginForm">

<label>البريد الإلكتروني</label>

<input
type="email"
id="email"
placeholder="اكتب البريد الإلكتروني"
required
>

<label>كلمة المرور</label>

<input
type="password"
id="password"
placeholder="اكتب كلمة المرور"
required
>

<button type="submit">
تسجيل الدخول
</button>

<div class="message" id="message"></div>

</form>

<a class="register" href="register.html">
ليس لديك حساب؟ إنشاء حساب
</a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;
const message=document.getElementById("message");

let account=null;

/* الحساب بالطريقة الجديدة */
const savedAccount=localStorage.getItem("anon_account");

if(savedAccount){

try{
account=JSON.parse(savedAccount);
}catch(error){
account=null;
}

}

/* لو الحساب القديم محفوظ كبيانات منفصلة */
if(!account){

const oldEmail=localStorage.getItem("anon_email");
const oldPassword=localStorage.getItem("anon_password");
const oldUsername=localStorage.getItem("anon_username");
const oldDiscord=localStorage.getItem("anon_discord");

if(oldEmail && oldPassword){

account={
username:oldUsername || "",
discord:oldDiscord || "",
email:oldEmail,
password:oldPassword
};

}

}

/* مفيش حساب */
if(!account){

message.textContent="لا يوجد حساب محفوظ على هذا المتصفح ❌";
return;

}

/* التحقق */
if(
email.toLowerCase()===account.email.toLowerCase() &&
password===account.password
){

/* حفظ الحساب بالطريقة الموحدة */
localStorage.setItem(
"anon_account",
JSON.stringify(account)
);

localStorage.setItem(
"anon_username",
account.username
);

localStorage.setItem(
"anon_email",
account.email
);

localStorage.setItem(
"anon_discord",
account.discord || ""
);

localStorage.setItem(
"anon_logged_in",
"true"
);

message.textContent="تم تسجيل الدخول بنجاح ✅";

setTimeout(function(){

window.location.href="profile.html";

},800);

}else{

message.textContent="البريد الإلكتروني أو كلمة المرور غير صحيحة ❌";

}

});

</script>

</body>
</html>
