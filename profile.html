<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حسابي | ANON RP</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#07080c;
color:#fff;
min-height:100vh;
line-height:1.7;
}

header{
background:#0d0e13;
border-bottom:1px solid #2b1118;
padding:15px 20px;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:27px;
font-weight:900;
}

.logo span{
color:#ef233c;
}

.home{
background:#22242c;
border:1px solid #444;
color:#fff;
padding:10px 16px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.container{
width:92%;
max-width:700px;
margin:45px auto;
}

.title{
text-align:center;
margin-bottom:30px;
}

.title h1{
font-size:38px;
}

.title h1 span{
color:#ef233c;
}

.title p{
color:#888;
margin-top:5px;
}

.profile-card{
background:#111217;
border:1px solid #3a151d;
border-radius:20px;
padding:30px;
}

.avatar{
width:90px;
height:90px;
margin:0 auto 20px;
border-radius:50%;
background:#ef233c;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
}

.info-box{
background:#08090d;
border:1px solid #292a30;
border-radius:12px;
padding:15px;
margin-bottom:14px;
}

.info-label{
display:block;
color:#888;
font-size:14px;
margin-bottom:5px;
}

.info-value{
font-size:17px;
font-weight:bold;
word-break:break-word;
}

input{
width:100%;
padding:13px;
margin-top:5px;
background:#08090d;
border:1px solid #333;
border-radius:10px;
color:#fff;
font-size:16px;
outline:none;
}

input:focus{
border-color:#ef233c;
}

.actions{
margin-top:25px;
display:flex;
gap:10px;
}

button,
.action-link{
flex:1;
display:block;
padding:14px;
border-radius:10px;
font-size:16px;
font-weight:bold;
text-align:center;
cursor:pointer;
text-decoration:none;
}

.save{
background:#ef233c;
color:#fff;
border:0;
}

.logout{
background:#22242c;
color:#fff;
border:1px solid #444;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
}

footer{
margin-top:70px;
padding:30px 20px;
text-align:center;
color:#777;
border-top:1px solid #222;
}

@media(max-width:600px){

.nav{
gap:10px;
}

.logo{
font-size:23px;
}

.home{
font-size:14px;
padding:8px 12px;
}

.container{
margin-top:30px;
}

.title h1{
font-size:30px;
}

.profile-card{
padding:20px;
}

.actions{
flex-direction:column;
}

}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo">
ANON <span>RP</span>
</div>

<a class="home" href="index.html">
الرئيسية
</a>

</div>

</header>


<div class="container">

<div class="title">

<h1>
حسابي <span>👤</span>
</h1>

<p>
إدارة بيانات حسابك في ANON RP
</p>

</div>


<div class="profile-card">

<div class="avatar">
👤
</div>


<div class="info-box">

<span class="info-label">
اسم المستخدم
</span>

<input
type="text"
id="username"
placeholder="اسم المستخدم"
>

</div>


<div class="info-box">

<span class="info-label">
Discord
</span>

<input
type="text"
id="discord"
placeholder="Discord"
>

</div>


<div class="info-box">

<span class="info-label">
البريد الإلكتروني
</span>

<input
type="email"
id="email"
placeholder="البريد الإلكتروني"
>

</div>


<div class="info-box">

<span class="info-label">
حالة الحساب
</span>

<div class="info-value">
<span style="color:#42d66b;">
● مسجل الدخول
</span>
</div>

</div>


<div class="actions">

<button class="save" id="saveBtn">
حفظ التعديلات
</button>

<button class="logout" id="logoutBtn">
تسجيل الخروج
</button>

</div>


<div class="message" id="message"></div>

</div>

</div>


<footer>

© 2026 ANON RP
<br>
جميع الحقوق محفوظة

</footer>


<script>

/* التأكد من تسجيل الدخول */

if(localStorage.getItem("anon_logged_in") !== "true"){

window.location.href="login.html";

}


/* قراءة الحساب */

let account = null;

const savedAccount =
localStorage.getItem("anon_account");


if(savedAccount){

try{

account = JSON.parse(savedAccount);

}catch(error){

account = null;

}

}


/* دعم الحسابات القديمة */

if(!account){

account = {

username:
localStorage.getItem("anon_username") || "",

discord:
localStorage.getItem("anon_discord") || "",

email:
localStorage.getItem("anon_email") || "",

password:
localStorage.getItem("anon_password") || ""

};

}


/* عرض البيانات */

document.getElementById("username").value =
account.username || "";

document.getElementById("discord").value =
account.discord || "";

document.getElementById("email").value =
account.email || "";


/* حفظ التعديلات */

document.getElementById("saveBtn").addEventListener("click",function(){

const username =
document.getElementById("username").value.trim();

const discord =
document.getElementById("discord").value.trim();

const email =
document.getElementById("email").value.trim();

const message =
document.getElementById("message");


if(username.length < 3){

message.textContent =
"اسم المستخدم يجب أن يكون 3 أحرف على الأقل ❌";

return;

}


if(!email){

message.textContent =
"اكتب البريد الإلكتروني ❌";

return;

}


/* تحديث الحساب */

account.username = username;
account.discord = discord;
account.email = email;


/* حفظ الحساب */

localStorage.setItem(
"anon_account",
JSON.stringify(account)
);

localStorage.setItem(
"anon_username",
username
);

localStorage.setItem(
"anon_discord",
discord
);

localStorage.setItem(
"anon_email",
email
);


message.style.color="#42d66b";

message.textContent =
"تم حفظ التعديلات بنجاح ✅";


setTimeout(function(){

message.textContent="";

},2500);

});


/* تسجيل الخروج */

document.getElementById("logoutBtn").addEventListener("click",function(){

localStorage.removeItem("anon_logged_in");

window.location.href="index.html";

});

</script>

</body>

</html>
