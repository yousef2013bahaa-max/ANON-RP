<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANON-RP | حسابي</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#15151c;
padding:20px;
border-radius:15px;
margin:15px 0;
}

h1{
color:#00eaff;
text-align:center;
}

.msg{
background:#20202b;
padding:15px;
border-radius:10px;
margin:10px 0;
}

</style>

</head>

<body>

<div class="container">

<h1>👤 حسابي ANON-RP</h1>

<div class="card">

<h2>📩 الرسائل</h2>

<div id="messages">
جاري تحميل الرسائل...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zqpemyoukxseyhgnrzja.supabase.co";


const SUPABASE_KEY =
"sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";



async function loadMessages(){


let res = await fetch(

SUPABASE_URL+"/rest/v1/massages?select=*",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

}

}

);


let data = await res.json();


let box=document.getElementById("messages");

box.innerHTML="";


data.forEach(msg=>{


box.innerHTML += `

<div class="msg">

${msg.message}

</div>

`;

});


}


loadMessages();


</script>


</body>
</html>
