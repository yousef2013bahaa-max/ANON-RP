<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حسابي - ANON RP</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#08090d;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:500px;
    background:#111217;
    border:1px solid #3a151d;
    border-radius:20px;
    padding:35px;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-bottom:25px;
}

.logo span{
    color:#ef233c;
}

.avatar{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    margin-bottom:10px;
}

.info{
    color:#aaa;
    margin-bottom:25px;
}

button{
    border:0;
    padding:14px 25px;
    border-radius:10px;
    background:#ef233c;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin:5px;
}

.home{
    background:#22242c;
}

.message{
    margin-top:15px;
    color:#aaa;
}
</style></head><body><div class="box"><div class="logo">
ANON <span>RP</span>
</div><div class="avatar">👤</div><h1 id="username">المستخدم</h1><div class="info" id="email">
البريد الإلكتروني
</div><button onclick="logout()">
تسجيل الخروج
</button><button class="home" onclick="location.href='index.html'">
الرئيسية
</button><div class="message" id="message"></div></div><script>
const username = localStorage.getItem("anon_username");
const email = localStorage.getItem("anon_email");
const loggedIn = localStorage.getItem("anon_logged_in");

if(loggedIn !== "true" || !username){
    window.location.href = "login.html";
}else{
    document.getElementById("username").textContent = username;
    document.getElementById("email").textContent = email || "";
}

function logout(){

    localStorage.removeItem("anon_logged_in");

    document.getElementById("message").textContent =
    "تم تسجيل الخروج ✅";

    setTimeout(function(){
        window.location.href = "index.html";
    }, 700);
}
</script></body>
</html>
