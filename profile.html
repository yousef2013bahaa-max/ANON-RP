<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | ANON-RP</title>

  <style>

    body {

      background: #0b0b0f;
      color: white;
      padding: 25px;

    }

      display: block;
      width: 100%;
      padding: 14px;

      color: black;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .button:hover {
      opacity: 0.9;
    }

    .back {

      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;

</head>
