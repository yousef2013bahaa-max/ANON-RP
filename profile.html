<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANON RP - حسابي</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#08090d;
    color:white;
}

.container{
    width:90%;
    max-width:650px;
    margin:50px auto;
}

.box{
    background:#111217;
    border:1px solid #3a151d;
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 40px #000;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:#ef233c;
}

.avatar{
    width:100px;
    height:100px;
    margin:25px auto 15px;
    border-radius:50%;
    background:#ef233c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.username{
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.rank{
    text-align:center;
    color:#ef233c;
    margin-top:8px;
}

.info{
    background:#20222a;
    padding:16px;
    margin-top:12px;
    border-radius:12px;
}

.label{
    color:#999;
    display:block;
    margin-bottom:6px;
}

.value{
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.stat{
    background:#20222a;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.stat-number{
    font-size:28px;
    font-weight:bold;
    color:#ef233c;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.home{
    background:#ef233c;
}

.logout{
    background:#33353d;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<div class="logo">
ANON <span>RP</span>
</div>

<div class="avatar">
👤
</div>

<div class="username" id="username">---</div>

<div class="rank">
لاعب جديد
</div>

<div class="info">
<span class="label">📧 البريد الإلكتروني</span>
<span class="value" id="email">---</span>
</div>

<div class="info">
<span class="label">💬 Discord</span>
<span class="value" id="discord">---</span>
</div>

<div class="stats">

<div class="stat">
<div class="stat-number">0</div>
<div>النقاط</div>
</div>

<div class="stat">
<div class="stat-number">0</div>
<div>ساعات اللعب</div>
</div>

</div>

<button class="home" onclick="location.href='index.html'">
🏠 الصفحة الرئيسية
</button>

<button class="logout" onclick="logout()">
🚪 تسجيل الخروج
</button>

</div>

</div>

<script>

const loggedIn = localStorage.getItem("anon_logged_in");

if(loggedIn !== "true"){
    window.location.href = "login.html";
}

document.getElementById("username").textContent =
    localStorage.getItem("anon_username") || "---";

document.getElementById("email").textContent =
    localStorage.getItem("anon_email") || "---";

document.getElementById("discord").textContent =
    localStorage.getItem("anon_discord") || "---";

function logout(){
    localStorage.removeItem("anon_logged_in");
    window.location.href = "login.html";
}

</script>

</body>
</html>
