<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANON RP - حسابي</title>

<style>
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#08090d;
    color:white;
}

.container{
    max-width:600px;
    margin:60px auto;
    padding:20px;
}

.box{
    background:#111217;
    border:1px solid #3a151d;
    border-radius:20px;
    padding:30px;
}

h1{
    text-align:center;
}

h1 span{
    color:#ef233c;
}

.info{
    background:#22242c;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
}

.label{
    color:#aaa;
    display:block;
    margin-bottom:6px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.home{
    background:#ef233c;
}

.logout{
    background:#33353d;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>ANON <span>RP</span></h1>

<h2>👤 حسابي</h2>

<div class="info">
<span class="label">اسم المستخدم</span>
<span id="username">---</span>
</div>

<div class="info">
<span class="label">البريد الإلكتروني</span>
<span id="email">---</span>
</div>

<div class="info">
<span class="label">Discord</span>
<span id="discord">---</span>
</div>

<button class="home" onclick="location.href='index.html'">
الصفحة الرئيسية
</button>

<button class="logout" onclick="logout()">
تسجيل الخروج
</button>

</div>

</div>

<script>

const loggedIn = localStorage.getItem("anon_logged_in");

if(loggedIn !== "true"){
    window.location.href = "login.html";
}

document.getElementById("username").textContent =
    localStorage.getItem("anon_username") || "---";

document.getElementById("email").textContent =
    localStorage.getItem("anon_email") || "---";

document.getElementById("discord").textContent =
    localStorage.getItem("anon_discord") || "---";

function logout(){

    localStorage.removeItem("anon_logged_in");

    window.location.href = "login.html";
}

</script>

</body>
</html>
