<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | ANON RP</title><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#07080c;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:450px;
    background:#111217;
    border:1px solid #3a151d;
    border-radius:20px;
    padding:30px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

.logo span{color:#ef233c}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #333;
    border-radius:10px;
    background:#08090d;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{border-color:#ef233c}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#ef233c;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#aaa;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#ef233c;
    text-decoration:none;
}
</style></head><body><div class="box"><div class="logo">
ANON <span>RP</span>
</div><form id="registerForm"><label for="username">اسم المستخدم</label>
<input type="text" id="username" placeholder="اكتب اسم المستخدم" minlength="3" required>

<label for="discord">Discord</label>
<input type="text" id="discord" placeholder="اسمك في Discord" required>

<label for="email">البريد الإلكتروني</label>
<input type="email" id="email" placeholder="example@email.com" required>

<label for="password">كلمة المرور</label>
<input type="password" id="password" placeholder="6 أحرف على الأقل" minlength="6" required>

<button type="submit">إنشاء الحساب</button>

<div class="message" id="message"></div></form><a class="back" href="index.html">العودة للرئيسية</a>

</div><script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const discord = document.getElementById("discord").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (username.length < 3) {
        message.textContent = "اسم المستخدم لازم يكون 3 أحرف على الأقل.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "كلمة المرور لازم تكون 6 أحرف على الأقل.";
        return;
    }

    localStorage.setItem("anon_account", JSON.stringify({
        username: username,
        discord: discord,
        email: email,
        password: password
    }));

    localStorage.setItem("anon_username", username);
    localStorage.setItem("anon_email", email);
    localStorage.setItem("anon_discord", discord);
    localStorage.setItem("anon_logged_in", "true");

    message.textContent = "تم إنشاء الحساب بنجاح ✅";

    setTimeout(function() {
        window.location.href = "profile.html";
    }, 800);
});
</script></body>
</html>
