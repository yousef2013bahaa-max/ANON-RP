<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب | ANON RP</title><style>
body{
    margin:0;
    padding:20px;
    background:#07080c;
    color:white;
    font-family:Arial,Tahoma,sans-serif;
}

.container{
    width:90%;
    max-width:420px;
    margin:50px auto;
    background:#111217;
    padding:30px;
    border-radius:20px;
    border:1px solid #3a151d;
}

h1{
    text-align:center;
}

h1 span{
    color:#ef233c;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #444;
    background:#08090d;
    color:white;
    font-size:16px;
}

button{
    display:block;
    width:100%;
    margin-top:25px;
    padding:15px;
    background:#ef233c;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
}

a{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#ef233c;
}
</style></head><body><div class="container"><h1>إنشاء حساب <span>ANON RP</span></h1><form id="registerForm"><label>اسم المستخدم</label>
<input id="username" type="text" required>

<label>Discord</label>
<input id="discord" type="text" required>

<label>البريد الإلكتروني</label>
<input id="email" type="email" required>

<label>كلمة المرور</label>
<input id="password" type="password" minlength="6" required>

<button type="submit">إنشاء الحساب</button>

<div id="message"></div></form><a href="index.html">العودة للرئيسية</a>

</div><script>
document.getElementById("registerForm").addEventListener("submit", function(event){

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const discord = document.getElementById("discord").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(username.length < 3){
        document.getElementById("message").textContent =
        "اسم المستخدم قصير جدًا";
        return;
    }

    if(password.length < 6){
        document.getElementById("message").textContent =
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
        return;
    }

    localStorage.setItem("anon_username", username);
    localStorage.setItem("anon_discord", discord);
    localStorage.setItem("anon_email", email);
    localStorage.setItem("anon_password", password);
    localStorage.setItem("anon_logged_in", "true");

    document.getElementById("message").textContent =
    "تم إنشاء الحساب بنجاح ✅";

    setTimeout(function(){
        window.location.href = "profile.html";
    },1000);

});
</script></body>
</html>
