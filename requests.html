<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANON-RP | طلبات التقديم</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#15151c;
padding:20px;
border-radius:15px;
margin:15px 0;
}

h1{
color:#00eaff;
text-align:center;
}

button{
padding:10px 15px;
border:0;
border-radius:10px;
cursor:pointer;
margin:5px;
font-weight:bold;
}

.accept{
background:#38d66b;
}

.reject{
background:#ff4d4d;
color:white;
}

.back{
background:#00eaff;
}

.status{
padding:10px;
background:#20202b;
border-radius:10px;
}

</style>

</head>


<body>


<div class="container">


<h1>📋 طلبات التقديم</h1>


<div id="requests">
جاري تحميل الطلبات...
</div>


<button class="back" onclick="back()">
⬅️ رجوع
</button>


</div>



<script>


const SUPABASE_URL =
"https://zqpemyoukxseyhgnrzja.supabase.co";


const SUPABASE_KEY =
"sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";



async function loadRequests(){


let res = await fetch(

SUPABASE_URL+"/rest/v1/applications?select=*",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

}

}

);



let data = await res.json();


let box=document.getElementById("requests");

box.innerHTML="";


data.forEach(app=>{


box.innerHTML += `

<div class="card">

<h2>📄 طلب تقديم</h2>

<p>الاسم: ${app.name}</p>

<p>العمر: ${app.age}</p>

<p>Discord: ${app.discord}</p>

<p>النوع: ${app.type}</p>


<div class="status">

الحالة:
${app.status || "pending"}

</div>


<button class="accept"
onclick="changeStatus(${app.id},'accepted')">

✅ قبول

</button>


<button class="reject"
onclick="changeStatus(${app.id},'rejected')">

❌ رفض

</button>


</div>

`;

});


}




async function changeStatus(id,status){


let res = await fetch(

SUPABASE_URL+"/rest/v1/applications?id=eq."+id,

{

method:"PATCH",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY,

"Content-Type":"application/json",

"Prefer":"return=representation"

},

body:JSON.stringify({

status:status

})

}

);


if(res.ok){

alert("تم تحديث الحالة ✅");

loadRequests();

}else{

alert("حدث خطأ ❌");

}


}





function back(){

window.location.href="profile.html";

}



loadRequests();


</script>


</body>

</html>
