<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANON-RP | الطلبات</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#15151c;
padding:20px;
border-radius:15px;
margin:15px 0;
}

button{
padding:10px 15px;
border:0;
border-radius:10px;
margin:5px;
font-weight:bold;
cursor:pointer;
}

.accept{
background:#38d66b;
}

.reject{
background:#ff4d4d;
color:white;
}

</style>

</head>


<body>


<div class="container">

<h1>📋 طلبات التقديم</h1>

<div id="requests">
جاري التحميل...
</div>


</div>



<script>


const SUPABASE_URL =
"https://zqpemyoukxseyhgnrzja.supabase.co";


const SUPABASE_KEY =
"sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";



async function loadRequests(){


let res = await fetch(

SUPABASE_URL+"/rest/v1/applications?select=*",

{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}

);


let data = await res.json();


let box=document.getElementById("requests");

box.innerHTML="";


data.forEach(app=>{


box.innerHTML += `

<div class="card">

<h3>📄 طلب</h3>

<p>الاسم: ${app.name}</p>

<p>العمر: ${app.age}</p>

<p>Discord: ${app.discord}</p>

<p>الحالة: ${app.status || "pending"}</p>


<button class="accept"
onclick="changeStatus(${app.id},'accepted')">
✅ قبول
</button>


<button class="reject"
onclick="changeStatus(${app.id},'rejected')">
❌ رفض
</button>


</div>

`;

});


}





async function changeStatus(id,status){


// تحديث الحالة

await fetch(

SUPABASE_URL+"/rest/v1/applications?id=eq."+id,

{

method:"PATCH",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY,

"Content-Type":"application/json"

},

body:JSON.stringify({

status:status

})

}

);



// إرسال رسالة

let msg = status === "accepted"
? "🎉 تم قبول طلبك في ANON-RP"
: "❌ تم رفض طلبك في ANON-RP";



await fetch(

SUPABASE_URL+"/rest/v1/massages",

{

method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY,

"Content-Type":"application/json"

},

body:JSON.stringify({

application_id:id,

message:msg

})

}

);



alert("تم إرسال النتيجة للاعب ✅");


loadRequests();


}



loadRequests();


</script>


</body>

</html>
