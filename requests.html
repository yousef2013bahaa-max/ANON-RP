<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANON-RP | طلبات التقديم</title>

<style>

body{
background:#0b0b0f;
color:white;
font-family:Arial;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#15151c;
padding:20px;
border-radius:20px;
margin-top:20px;
}

h1{
color:#00eaff;
text-align:center;
}

.status{
background:#20202b;
padding:15px;
border-radius:12px;
margin-top:10px;
}

.pending{
color:#ffd700;
}

.accepted{
color:#38d66b;
}

.rejected{
color:#ff4d4d;
}

button{
background:#00eaff;
border:0;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<h1>📋 طلبات التقديم</h1>


<div class="card">


<div id="requests">
جاري تحميل الطلبات...
</div>


<br>

<button onclick="goHome()">
🏠 الرئيسية
</button>

<script>
function goHome(){
    window.location.href="index.html";
}
</script>


</div>


</div>



<script>


const SUPABASE_URL =
"https://zqpemyoukxseyhgnrzja.supabase.co";


const SUPABASE_KEY =
"sb_publishable_xfZeYMI33hXTvNy4Z3JPGQ_BMH4ufF2";



async function loadRequests(){


let res = await fetch(

SUPABASE_URL+"/rest/v1/applications?select=*",

{

headers:{

"apikey":SUPABASE_KEY,

"Authorization":"Bearer "+SUPABASE_KEY

}

}

);


let data = await res.json();

console.log(data);
    


let box=document.getElementById("requests");


box.innerHTML="";


if(data.length === 0){

box.innerHTML="لا يوجد طلبات حاليا 📭";

return;

}



data.forEach(app=>{


let status = app.status || "pending";


box.innerHTML += `

<div class="status">

<p>📄 الاسم: ${app.name}</p>

<p>العمر: ${app.age}</p>

<p>النوع: ${app.type}</p>

<p>
الحالة:
<button class="accept" onclick="changeStatus(${app.id},'accepted')">
✅ قبول
</button>

<button class="reject" onclick="changeStatus(${app.id},'rejected')">
❌ رفض
</button>


</div>

`;


});


}



function back(){

window.location.href="profile.html";

}



loadRequests();


</script>


</body>

</html>
